name: Repair Production Host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Repair nginx promotion permissions
        env:
          TEMP_ROOT_PASSWORD: ${{ secrets.TEMP_ROOT_PASSWORD }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail

          ssh_port="${PRODUCTION_SSH_PORT:-22}"
          sudo apt-get update
          sudo apt-get install -y sshpass

          install -d -m 700 ~/.ssh
          printf '%s\n' "${PRODUCTION_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${ssh_port}" -H "${PRODUCTION_SSH_HOST}" >> ~/.ssh/known_hosts

          sshpass -p "${TEMP_ROOT_PASSWORD}" ssh \
            -o StrictHostKeyChecking=accept-new \
            -p "${ssh_port}" \
            "root@${PRODUCTION_SSH_HOST}" \
            "DEPLOY_USER='${PRODUCTION_SSH_USER}' bash -s" <<'EOF'
          set -euo pipefail

          nginx -t
          systemctl enable --now nginx || nginx

          if ! id "${DEPLOY_USER}" >/dev/null 2>&1; then
            echo "Deploy user does not exist: ${DEPLOY_USER}" >&2
            exit 1
          fi

          cat > /etc/sudoers.d/robotronics-frontend-deploy <<SUDOERS
          ${DEPLOY_USER} ALL=(root) NOPASSWD: /usr/sbin/nginx
          SUDOERS
          chmod 440 /etc/sudoers.d/robotronics-frontend-deploy
          visudo -cf /etc/sudoers.d/robotronics-frontend-deploy

          readlink -f /srv/robotronics/frontend/current || true
          pgrep -x nginx >/dev/null
          EOF

          ssh -p "${ssh_port}" "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "sudo -n nginx -t && sudo -n nginx -s reload"
