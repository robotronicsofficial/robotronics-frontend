name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: robotronics-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify repo hygiene
        run: ./ops/ci/check-repo-hygiene.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Test frontend contracts
        run: pnpm run test:ci

      - name: Build frontend
        run: pnpm run build

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail

          payload="$(
            jq -n \
              --arg applicationId "${DOKPLOY_APPLICATION_ID}" \
              '{applicationId: $applicationId}'
          )"

          curl --fail-with-body --show-error --silent \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --data "${payload}"
